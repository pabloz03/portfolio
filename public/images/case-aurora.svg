<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#111111"/>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- token swatches -->
  <g opacity="0.9">
    <rect x="120" y="360" width="70" height="70" rx="8" fill="#f5f5f5"/>
    <rect x="204" y="360" width="70" height="70" rx="8" fill="#999999"/>
    <rect x="288" y="360" width="70" height="70" rx="8" fill="#666666"/>
    <rect x="372" y="360" width="70" height="70" rx="8" fill="#333333"/>
  </g>

  <!-- component blocks -->
  <rect x="120" y="470" width="220" height="16" rx="8" fill="#ffffff" opacity="0.15"/>
  <rect x="120" y="500" width="150" height="16" rx="8" fill="#ffffff" opacity="0.1"/>

  <text x="120" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#ffffff" opacity="0.92">Aurora</text>
  <text x="120" y="620" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#999999">DESIGN SYSTEM — SEMANTIC TOKENS — 150+ COMPONENTS</text>
</svg>
